<!--
  The shell's template. routerLinkActive marks the link for the current page. The AI light reads the
  connection status signal, so it changes the moment the status does. @switch picks one label by value.
-->
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <a routerLink="/" class="brand">ANPC</a>
  <nav aria-label="Main">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Worlds</a>
    <a routerLink="/new" routerLinkActive="active">New world</a>
  </nav>
  <button type="button" class="ai-light" [class]="ai.status()" (click)="ai.checkConnection()"
          [attr.aria-label]="'AI status: ' + ai.status() + '. Click to check again.'">
    @switch (ai.status()) {
      @case ('connected') { AI ready ({{ ai.model() }}) }
      @case ('offline') { AI offline: start Ollama }
      @default { Checking AI... }
    }
  </button>
</header>

<main id="main">
  <router-outlet />
</main>
